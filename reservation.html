<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Café de l'Art - Reservation</title>
        <link rel="stylesheet" href="style.css">
            <link rel="icon" type="image/png" href="./icons/title-logo-icon.png">
    </head>
    <body>
        <header>
            <div class="logo">
                <img src="./icons/business-logo.png" alt="Logo" id="logo">
            </div>
            <div class="services">
                <ul class="menu">
                    <li>
                        <button class="btn">HOME</button>
                    </li>
                    <li>
                        <button class="btn">MENU</button>
                    </li>
                    <li>
                        <button class="btn">RESERVE</button>
                    </li>
                </ul>
            </div>
            <div class="login">
                <button class="login-btn">SIGN IN</button>
            </div>
        </header>
        <main>
            <section class="connection">
                <div class="offline hidden">
                    Connection Lost! Try to connect again...
                </div>
            </section>
            <section class="banner">
                <div class="banner-img">
                    <img src="./images/interior.png" alt="Interior">
                </div>
            </section>
            <section class="reservation-form">
                <form>
                    <label for="first-name">
                        First Name:
                        <input type="text" placeholder="Your name" name="first-name" required>
                        <div class="error-msg" id="first-name-error"></div>
                    </label>
                    <label for="last-name">
                        Last Name:
                        <input type="text" placeholder="Your surname" name="last-name" required>
                        <div class="error-msg" id="last-name-error"></div>
                    </label>
                    <label for="phone">
                        Phone Number:
                        <input type="tel" placeholder="+994 XX XXX XX XX" name="phone" required>
                        <div class="error-msg" id="phone-error"></div>
                    </label>
                    <label for="reserve-date">
                        Date:
                        <input type="date" name="reserve-date" required>
                        <div class="error-msg" id="date-error"></div>
                    </label>
                    <label for="reserve-time">
                        Time:
                        <input type="time" name="reserve-time" required>
                        <div class="error-msg" id="date-error"></div>
                    </label>
                    <label for="table">
                        Table:
                        <select name="table">
                            <option value="select" disabled selected>Select table</option>
                            <option value="1">Table №1</option>
                            <option value="2">Table №2</option>
                            <option value="3">Table №3</option>
                            <option value="4">Table №4</option>
                            <option value="5">Table №5</option>
                            <option value="6">Table №6</option>
                        </select>
                    </label>
                    <label for="guest">
                        Guests:
                        <select name="guest" required>
                            <option value="select" disabled selected>Select person count</option>
                            <option value="1">1 Person</option>
                            <option value="2">2 People</option>
                            <option value="3">3 People</option>
                            <option value="4">4 People</option>
                        </select>
                    </label>
                    <button type="submit">CONFIRM</button>
                </form>
            </section>
        </main>
        <footer>
            <div class="footer-area">
                <div class="brand-area">
                    <div class="brand-img">
                        <img src="./icons/business-logo.png" alt="Café de l'Art">
                    </div>
                    <div class="brand-slogan">
                        <p>Where passion meets the cup, and coffee becomes a masterpiece</p>
                    </div>
                </div>
                <div class="business-info">
                    <div class="info contact-info">
                        <h3>Contact</h3>
                        <div class="location">
                            <img src="./icons/11.png" alt="Location">
                            <p>Baku, White City, 8 November Ave.</p>
                        </div>
                        <div class="phone">
                            <img src="./icons/7.png" alt="Phone">
                            <p>+994 12 310 00 00</p>
                        </div>
                        <div class="email">
                            <img src="./icons/10.png" alt="Email">
                            <p>info@cafedelart.com</p>
                        </div>
                    </div>
                    <div class="info social-links">
                        <h3>Social Links</h3>
                        <div class="social facebook">
                            <img src="./icons/8.png" alt="Facebook" class="social-icon">
                            <p>Facebook</p>
                        </div>
                        <div class="social instagram">
                            <img src="./icons/5.png" alt="Instagram" class="social-icon">
                            <p>Instagram</p>
                        </div>
                        <div class="social whatsapp">
                            <img src="./icons/6.png" alt="WhatsApp" class="social-icon">
                            <p>WhatsApp</p>
                        </div>
                    </div>
                    <div class="info opening-hours">
                        <h3>Opening Hours</h3>
                        <p>Mon - Fri: 09:00 - 23:00</p>
                        <p>Sat - Sun: 10:00 - 22:00</p>
                    </div>
                </div>
            </div>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
